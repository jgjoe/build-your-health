name: byh-loadtest
services:
  app:
    build:
      context: ..
    # Stage 3 compares a before and an after image under the same settings.
    image: ${APP_IMAGE:-byh-loadtest-app:latest}
    cpus: 2
    mem_limit: 2g
    volumes:
      - './v3-profile.jfc:/opt/byh/v3-profile.jfc:ro'
    environment:
      DB_URL: jdbc:oracle:thin:@byh-perf-perfdb-1:1521/FREEPDB1
      DB_USERNAME: byh_load
      DB_PASSWORD: ${LOAD_DB_PASSWORD:-byhload123}
      SPRING_DATASOURCE_HIKARI_REGISTER_MBEANS: 'true'
      # Spring Boot default is 10; V2 cause isolation varies it via POOL_SIZE.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${POOL_SIZE:-10}
      # Stage 3 login limit (ignored by images without it); app defaults otherwise.
      # Warmup iterations only affect the first stage 3 image (byh-loadtest-app:stage3), kept to reproduce it.
      BYH_LOGIN_MAX_CONCURRENT: ${LOGIN_MAX_CONCURRENT:-2}
      BYH_LOGIN_MAX_WAIT_MS: ${LOGIN_MAX_WAIT_MS:-50}
      BYH_LOGIN_WARMUP_ITERATIONS: ${LOGIN_WARMUP_ITERATIONS:-20}
      JAVA_TOOL_OPTIONS: >-
        ${JFR_OPTS:-}
        -Xms512m -Xmx1024m
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9010
        -Dcom.sun.management.jmxremote.rmi.port=9010
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false
        -Djava.rmi.server.hostname=app
    ports:
      - '127.0.0.1:8082:8081'
    networks:
      - measurement
networks:
  measurement:
    external: true
    name: byh-perf_default
